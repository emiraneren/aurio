# Aurio on any machine with Docker: docker compose up -d, then open http://<this machine>:4180
services:
  aurio:
    image: ghcr.io/emiraneren/aurio:latest
    # Or build it from this folder instead:
    # build: .
    container_name: aurio
    ports:
      - "4180:4180"
    volumes:
      - aurio-data:/data # library: playlists, favorites, history
      - aurio-cache:/cache # HD videos already downloaded
    environment:
      # Optional, see the README: cookies for YouTube's bot checks, region for search results.
      # YTDLP_EXTRA_ARGS: "--cookies /data/cookies.txt"
      # AURIO_LOCATION: "US"
      AURIO_CACHE_MAX_MB: "2048"
    restart: unless-stopped

volumes:
  aurio-data:
  aurio-cache:
