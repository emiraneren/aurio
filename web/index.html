<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C0F" />
    <meta name="description" content="Your music, uninterrupted." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurio" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Aurio</title>
    <script>
      try {
        var t = localStorage.getItem("aurio:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        // Before the app loads, so screen readers and the browser see the chosen language right away.
        var l = localStorage.getItem("aurio:lang");
        if (l === "en" || l === "pt-BR") document.documentElement.lang = l;
        // Appearance chosen in Settings, applied before the first paint.
        var css = localStorage.getItem("aurio:accent-css");
        if (css) {
          var s = document.createElement("style");
          s.id = "aurio-accent";
          s.textContent = css;
          document.head.appendChild(s);
        }
        var a = JSON.parse(localStorage.getItem("aurio:appearance") || "{}");
        if (a.compactSidebar === true) document.documentElement.dataset.rail = "compact";
        if (a.texture === false) document.documentElement.dataset.texture = "off";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
